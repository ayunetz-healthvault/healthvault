# Queues for the local stack. Mirrors what P2-06 describes: one processing queue
# with a visibility timeout long enough for a document, and a dead-letter queue
# that a message reaches after three failed attempts rather than being retried
# forever.

include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

queues {
  ayunetz-processing {
    # Longer than the orchestrator's own 120 s budget, so a worker that is
    # legitimately slow does not have its message handed to a second worker.
    defaultVisibilityTimeout = 180 seconds
    delay = 0 seconds
    receiveMessageWait = 5 seconds
    deadLettersQueue {
      name = "ayunetz-processing-dlq"
      maxReceiveCount = 3
    }
  }

  ayunetz-processing-dlq {
    defaultVisibilityTimeout = 180 seconds
    delay = 0 seconds
    receiveMessageWait = 0 seconds
  }
}
